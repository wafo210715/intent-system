   颜色取自 Orbita Design System（light：米白 + 蓝；dark：黑 + 黄）。 */
:root {
  color-scheme: light;
  --bg-app: #f3f4f1; --bg-sidebar: #f7f7f3; --bg-panel: #ffffff; --bg-muted: #f8f8f5;
  --bg-hover: color-mix(in srgb, #5f6368 12%, transparent); --bg-active: #e7eefd;
  --text: #202124; --text-2: #5f6368; --text-3: #8b8f94;
  --border-subtle: #e5e5df; --border: #dfdfd7; --border-strong: #d7d7cf;
  --accent: #1d4ed8; --accent-strong: #16379c; --accent-soft: #e7eefd; --accent-fg: #ffffff;
  --danger: #b42318; --danger-soft: #fdecea; --success: #2f7a4b; --success-soft: #e6f3ea;
  --warning: #9a6700; --warning-soft: #fdf3dc;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --radius: 8px; --radius-sm: 6px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg-app: #191c1d; --bg-sidebar: #1e2223; --bg-panel: #232525; --bg-muted: #1b1f20;
    --bg-hover: color-mix(in srgb, #a3a29b 8%, transparent); --bg-active: rgba(214,194,69,.12);
    --text: #d6d5cf; --text-2: #a3a29b; --text-3: #7d7c76;
    --border-subtle: #292b2b; --border: #333534; --border-strong: #3d403f;
    --accent: #d6c245; --accent-strong: #e2d05e; --accent-soft: rgba(214,194,69,.18); --accent-fg: #1b1a15;
    --danger: #ff7b72; --danger-soft: #3b1f1d; --success: #6cc08b; --success-soft: rgba(108,192,139,.14);
    --warning: #e3b341; --warning-soft: rgba(227,179,65,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg-app); color: var(--text); font: 14px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }

/* ---------- 左侧导航 ---------- */
.side { background: var(--bg-sidebar); border-right: 1px solid var(--border-subtle); padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 8px; padding: 4px 10px 14px; font-weight: 650; }
.brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-sm); color: var(--text-2); text-decoration: none; }
.nav a:hover { background: var(--bg-hover); color: var(--text); }
.nav a.on { background: var(--bg-active); color: var(--text); font-weight: 600; }
.nav .count { margin-left: auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.nav svg { width: 16px; height: 16px; flex: none; }
.side .foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--text-3); line-height: 1.6; }
.side .foot code { font-family: var(--mono); font-size: 11.5px; }

/* ---------- 主区 ---------- */
main { padding: 28px 32px 64px; max-width: 1080px; width: 100%; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.sub { color: var(--text-2); margin: 4px 0 0; }
h2 { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 28px 0 10px; text-transform: none; }
.card { background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--radius); }
.pad { padding: 16px 18px; }
.muted { color: var(--text-2); } .faint { color: var(--text-3); } .mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }

/* 按钮 */
.btn { height: 30px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.primary:hover { background: var(--accent-strong); }
.btn.ghost { border-color: transparent; color: var(--text-2); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .switch:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 开关 */
.switch { width: 34px; height: 20px; border-radius: 999px; background: var(--border-strong); border: 0; position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(14px); }

/* 标签 */
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 12px; background: var(--bg-muted); color: var(--text-2); border: 1px solid var(--border-subtle); white-space: nowrap; }
.tag.ok { background: var(--success-soft); color: var(--success); border-color: transparent; }
.tag.warn { background: var(--warning-soft); color: var(--warning); border-color: transparent; }
.tag.err { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.tag.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* 概览数字 */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.apps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 4px; }
.app-card { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; }
.app-card .t { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.app-card .d { font-size: 12.5px; color: var(--text-2); margin-top: 4px; }
.stat .k { font-size: 12.5px; color: var(--text-2); }
.stat .v { font-size: 24px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat .d { font-size: 12px; color: var(--text-3); margin-top: 2px; }

/* 提示条 */
.notice { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: var(--radius); background: var(--accent-soft); margin-bottom: 16px; flex-wrap: wrap; }
.notice.warn { background: var(--warning-soft); }
.notice .t { font-weight: 600; }

/* 来源卡 */
.sources { display: grid; gap: 12px; }
.src-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; flex-wrap: wrap; }
.src-ico { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.src-name { font-weight: 600; }
.src-body { border-top: 1px solid var(--border-subtle); padding: 12px 18px 16px; }
.bar { height: 6px; border-radius: 999px; background: var(--bg-muted); overflow: hidden; border: 1px solid var(--border-subtle); }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }

/* 表格 */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--text-3); padding: 8px 10px; border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--bg-hover); }
tr.excluded td:not(:last-child) { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-3); }
.ellipsis { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub-rows td { background: var(--bg-muted); font-size: 13px; }
.sub-rows td:first-child { padding-left: 34px; }

/* 筛选条 */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.seg { display: inline-flex; padding: 2px; border-radius: var(--radius-sm); background: var(--bg-muted); border: 1px solid var(--border-subtle); }
.seg button { border: 0; background: transparent; height: 26px; padding: 0 10px; border-radius: 4px; cursor: pointer; color: var(--text-2); }
.seg button.on { background: var(--bg-panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }
.input { height: 30px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-panel); padding: 0 10px; min-width: 0; }
.input.search { width: 240px; max-width: 100%; }

/* 设置表单 */
.form { display: grid; gap: 0; }
.field { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; padding: 14px 18px; border-bottom: 1px solid var(--border-subtle); align-items: start; }
.field:last-child { border-bottom: 0; }
.field .l { font-weight: 550; } .field .h { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.field .c { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field .c .input { flex: 1 1 220px; }

/* 抽屉 */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 10; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--bg-panel); border-left: 1px solid var(--border); box-shadow: var(--shadow); transform: translateX(100%); transition: transform .2s ease; z-index: 11; display: flex; flex-direction: column; }
.drawer.on { transform: none; }
.drawer .dh { padding: 16px 20px; border-bottom: 1px solid var(--border-subtle); display: flex; gap: 12px; align-items: flex-start; }
.drawer .db { padding: 16px 20px 32px; overflow-y: auto; display: grid; gap: 18px; align-content: start; }
.stages { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--text-2); }
.stages span::before { content: "✓ "; color: var(--success); }
.stages span.skip::before { content: "· "; color: var(--text-3); }
.stages span.err::before { content: "✕ "; color: var(--danger); }
.entry { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--bg-muted); border: 1px solid var(--border-subtle); display: grid; gap: 3px; }
.entry .meta { font-size: 12px; color: var(--text-3); }
.entry .q { font-weight: 550; }
.entry .c { font-size: 12.5px; color: var(--text-2); }

/* toast */
.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 20; }
.toast { background: #202124; color: #fff; padding: 9px 14px; border-radius: var(--radius-sm); box-shadow: var(--shadow); font-size: 13px; animation: in .18s ease; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
.empty { padding: 32px; text-align: center; color: var(--text-3); }

@media (max-width: 860px) {
  .apps { grid-template-columns: 1fr; }
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--border-subtle); }
  .brand { padding: 0 12px 0 0; }
  .nav { display: flex; gap: 2px; } .nav a { white-space: nowrap; } .nav .count { display: none; }
  .side .foot { display: none; }
  main { padding: 20px 16px 48px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .field { grid-template-columns: 1fr; gap: 8px; }
}
</style>
</head>

const dur = ms => { const s = Math.max(1, Math.round(ms / 1000)); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s`; };
const clockOf = t => { const d = new Date(t); return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const src = id => state.sources.find(s => s.id === id);
const active = s => s.active ?? s.projects.filter(p => !p.excluded).reduce((t, p) => t + p.count, 0) * (s.total ? s.imported / s.total : 0);
const progFrac = s => s.progress ?? (s.total ? s.imported / s.total : 0);
const progText = s => s.progressText ?? `导入 ${n(s.imported)} / ${n(s.total)} 条`;
const totalActive = () => state.sources.filter(s => s.enabled).reduce((t, s) => t + active(s), 0);
function toast(msg) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; $('#toasts').append(el); setTimeout(() => el.remove(), 2800); }

const ICONS = {
  overview: '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  sources: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  recalls: '<path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/>',
  verdicts: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;

/* ================= 渲染 ================= */
function renderNav() {
  const pages = [
    ['overview', '概览', ''],
    ['sources', '来源', state.sources.filter(s => s.consent === 'unasked' || s.error).length || pwRunning(state.prewarm) ? '●' : ''],
    ['settings', '设置', ''],
  ];
  $('#nav').innerHTML = pages.map(([id, label, c]) =>
    `<a href="#${id}" class="${state.page === id ? 'on' : ''}">${icon(id)}${label}<span class="count" style="${c === '●' ? 'color:var(--accent)' : ''}">${c}</span></a>`).join('');
}

function srcStatus(s) {
  if (s.importing) return `<span class="tag acc">${s.progressText ? esc(s.progressText) : `导入中 ${n(s.imported)}/${n(s.total)}`}</span>`;
  if (s.syncing) return `<span class="tag acc">同步中…</span>`;
  if (s.consent === 'unasked') return s.sessions ? `<span class="tag warn">未导入 · 发现 ${s.sessions} 个会话</span>` : '<span class="tag">未发现对话</span>';
  if (s.consent === 'no') return `<span class="tag">你选择了不导入</span>`;
  if (s.imported === 0) return `<span class="tag">未导入</span>`;
  if (s.error) return `<span class="tag err">有错误</span>`;
  if (!s.enabled) return `<span class="tag">已暂停</span>`;
  return `<span class="tag ok">正常</span>`;
}


/** 三步引导（10-12）：激活 → 导入并开始预热 → 预热完成。顺序无关：没激活也能先导入（概览提示激活后自动预热，
 *  预热按钮只在激活后出现）；预热的手动入口只有来源页的预热卡一个；这张卡走完自动消失。 */
function guideCard() {
  const c = state.config || {};
  const granted = c.hosted && c.hosted.granted;
  const un = state.sources.filter(s => s.consent !== 'no' && s.total > 0 && !s.imported);
  const importing = state.sources.find(s => s.importing);
  const pw = state.prewarm;
  const warmEnough = !pw || !pw.available || pwPct(pw) >= 0.9999;
  if (!granted) return ''; // 未激活时整个概览被向导页替换，不会走到这（兜底）
  if (un.length) {
    const total = un.reduce((t, s) => t + s.total, 0);
    const rate = pw && pw.ratePerSec ? pw.ratePerSec : 6;
    const secs = total / rate;
    const est = secs >= 90 ? `约 ${Math.ceil(secs / 60)} 分钟` : `约 ${Math.max(1, Math.ceil(secs))} 秒`;
    return `
  <div class="card pad" style="margin-bottom:14px;border-color:var(--accent)">
    <div class="row" style="gap:8px"><span class="faint">① 激活 · 已完成</span><span class="src-name">② 导入并开始预热</span></div>
    <p class="sub" style="margin:8px 0 6px">把下面的历史对话导入本机（只存这台电脑），导入后服务器会自动做一次缓存预热：</p>
    ${un.map(s => `<div class="row" style="gap:8px;margin:2px 0"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color}"></span><b>${s.name}</b>：找到 <b>${n(s.total)}</b> 条 · ${n(s.sessions)} 个会话</div>`).join('')}
    <p class="sub">首次预热预计<b>${est}</b>（约 ${n(total)} 条，按每秒 ${rate >= 10 ? Math.round(rate) : rate.toFixed(1)} 条）。可以先按项目排除不想要的部分再导入。</p>
    <div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap">
      ${importing
        ? `<span class="tag acc">正在导入${importing.progressText ? `：${importing.progressText}` : ''}…</span>`
        : `<button class="btn primary" data-action="next-import-all">导入并开始预热</button>
           <a class="btn ghost" href="#sources">先按项目排除</a>`}
    </div>
  </div>`;
  }
  if (state.config && state.config.engine === 'deepseek-own') {
    return `
  <div class="card pad" style="margin-bottom:14px">
    <div class="row" style="gap:8px"><span class="faint">① 激活 · 已完成　② 导入 · 已完成</span><span class="src-name">③ 就绪</span></div>
    <p class="sub" style="margin:8px 0 6px">自己配置（DeepSeek）模式不需要缓存预热——导入完成即可在 Claude Code 里提问。</p>
  </div>`;
  }
  if (!warmEnough) {
    const pct = Math.round(pwPct(pw) * 100);
    return `
  <div class="card pad" style="margin-bottom:14px">
    <div class="row" style="gap:8px"><span class="faint">① 激活 · 已完成　② 导入 · 已完成</span><span class="src-name">③ 缓存预热 ${pct}%</span></div>
    <p class="sub" style="margin:8px 0 6px">${pwRunning(pw) ? `预热进行中${pw.etaMs != null ? `，还要${etaText(pw.etaMs)}` : ''}；做完之前召回会很慢。` : '预热停了：去「来源」页继续。'}</p>
    <div class="bar" style="margin-bottom:8px"><i style="width:${pct}%"></i></div>
    <a class="btn" href="#sources">在「来源」查看</a>
  </div>`;
  }
  return '';
}

/** 引导第②步是否还在（概览有「导入并开始预热」卡）——期间来源页不给各自的导入按钮，单一主入口 */
function guideActive() {
  const c = state.config || {};
  if (!(c.hosted && c.hosted.granted)) return false;
  return state.sources.some(s => s.consent !== 'no' && s.total > 0 && !s.imported);
}

function pageOverview() {
  const done = state.recalls.filter(r => r.status === 'done');
  const pending = state.sources.find(s => s.consent === 'unasked');
  const errored = state.sources.find(s => s.error);
  const guide = guideCard();
  return `
  <div class="head"><div><h1>概览</h1><p class="sub">这台电脑上的意图系统：数据只在本机，不经过任何第三方。</p></div></div>
  ${guide}
  ${!guide && pending ? `<div class="notice"><span class="t">发现 ${esc(pending.name)} 记录</span><span class="muted">${pending.sessions} 个会话 / ${n(pending.total)} 条，导入后会一起用于召回。</span><span class="spacer"></span>
    <button class="btn primary" data-action="import" data-id="${pending.id}">导入</button><button class="btn ghost" data-action="decline" data-id="${pending.id}">不要</button></div>` : ''}
  ${!guide && (pwRunning(state.prewarm) || (state.prewarm.available && pwPct(state.prewarm) < 1 && state.sources.some(x => x.imported > 0))) ? `<div class="notice ${pwRunning(state.prewarm) ? '' : 'warn'}"><span class="t">缓存预热 ${Math.round(pwPct(state.prewarm) * 100)}%</span><span class="muted">${pwRunning(state.prewarm) ? `进行中${state.prewarm.etaMs != null ? `，还要${etaText(state.prewarm.etaMs)}` : ''}；做完之前召回会很慢` : '还没做完：召回会很慢，建议先开始预热'}</span><span class="spacer"></span><a class="btn" href="#sources">${pwRunning(state.prewarm) ? '查看' : '去预热'}</a></div>` : ''}
  ${errored ? `<div class="notice warn"><span class="t">${esc(errored.name)}</span><span class="muted">${esc(errored.error)}</span><span class="spacer"></span><button class="btn" data-action="retry" data-id="${errored.id}">重试</button></div>` : ''}
  <h2 style="margin-top:4px">在哪里使用意图系统</h2>
  <div class="apps">
    <section class="card app-card">
      <span class="src-ico" style="background:#c964421a;color:#c96442">C</span>
      <div style="flex:1;min-width:0">
        <div class="t">Claude Code ${state.apps.claude ? '<span class="tag ok">开</span>' : '<span class="tag">关</span>'}</div>
        <div class="d">开：新对话一开局就打开意图系统（每句先过门卫），第一句就生效。单个对话里仍可用输入框上方的按钮或 <span class="mono">/intent on|off</span> 临时切换。</div>
      </div>
      <button class="switch" role="switch" aria-label="Claude Code 使用意图系统" aria-checked="${state.apps.claude}" data-action="app-switch" data-app="claude"></button>
    </section>
    <section class="card app-card">
      <span class="src-ico" style="background:#3d3d3d1a;color:#3d3d3d">X</span>
      <div style="flex:1;min-width:0">
        <div class="t">Codex ${state.apps.codex ? '<span class="tag ok">开</span>' : '<span class="tag">关</span>'}<span class="tag warn">待接入</span></div>
        <div class="d">Codex 侧的接入（MCP）还没做：开关先记下，接入后生效。Codex 的对话现在已经可以作为历史被召回，见「来源」。</div>
      </div>
      <button class="switch" role="switch" aria-label="Codex 使用意图系统" aria-checked="${state.apps.codex}" data-action="app-switch" data-app="codex"></button>
    </section>
  </div>
  <h2>概况</h2>
  <div class="stats">
    <div class="card pad stat"><div class="k">参与召回</div><div class="v">${n(totalActive())}</div><div class="d">条 QA · ${state.sources.filter(s => s.enabled && s.imported).length} 个来源</div></div>
    <div class="card pad stat"><div class="k">近 7 天召回</div><div class="v">${state.recalls.filter(r => r.at > Date.now() - 7 * day).length}</div><div class="d">完成 ${done.length} · 跳过 ${state.recalls.filter(r => r.status === 'skipped').length} · 失败 ${state.recalls.filter(r => r.status === 'error').length}</div></div>
    <div class="card pad stat"><div class="k">平均用时</div><div class="v">${dur(done.reduce((t, r) => t + r.ms, 0) / Math.max(1, done.length))}</div><div class="d">由我们的服务器处理</div></div>
  </div>
  <h2>来源</h2>
  <div class="card"><div class="tbl-wrap"><table>
    <thead><tr><th>来源</th><th>状态</th><th class="num">参与召回</th><th>上次同步</th><th></th></tr></thead>
    <tbody>${state.sources.map(s => `<tr class="click" data-action="goto" data-page="sources">
      <td><div class="row"><span class="src-ico" style="background:${s.color}1a;color:${s.color};width:24px;height:24px;font-size:11px">${s.ico}</span>${esc(s.name)}</div></td>
      <td>${srcStatus(s)}</td><td class="num">${s.imported ? n(active(s)) : '—'}</td><td class="muted">${s.push ? '推送 · ' : ''}${rel(s.lastSync)}</td>
      <td style="text-align:right"><span class="faint">管理 ›</span></td></tr>`).join('')}</tbody>
  </table></div></div>
  <h2>最近召回</h2>
  <div class="card">${state.recalls.length ? `<div class="tbl-wrap"><table><tbody>${state.recalls.slice(0, 4).map(recallRow).join('')}</tbody></table></div>` : '<div class="empty">还没有召回记录：在 Claude 里打开意图系统开关，问一句试试</div>'}</div>`;
}

const pwRunning = pw => pw && pw.available && ['queued', 'running', 'paused'].includes(pw.phase);
const pwPct = pw => (pw && pw.coverage && pw.coverage.segs ? pw.coverage.warmed / pw.coverage.segs : 1);
const etaText = ms => (ms == null ? '' : ms < 90_000 ? '不到 2 分钟' : ms < 3_600_000 ? `约 ${Math.round(ms / 60000)} 分钟` : `约 ${(ms / 3_600_000).toFixed(1)} 小时`);

/** 缓存预热卡（来源页顶部）：同步完自动开始，不留到对话里 */
function prewarmCard() {
  const pw = state.prewarm;
  if (!pw || !pw.available) return '';
  const run = pwRunning(pw);
  const noData = !pw.coverage || !pw.coverage.segs; // 还没导入任何历史：没有段可热，别显示 100%
  const pct = noData ? 0 : Math.round(pwPct(pw) * 100);
  const frac = run && pw.total ? pw.done / pw.total : noData ? 0 : pwPct(pw);
  const status = noData && !run ? '<span class="tag">等待导入</span>'
    : pw.phase === 'queued' ? '<span class="tag acc">排队中</span>'
    : pw.phase === 'running' ? '<span class="tag acc">预热中</span>'
    : pw.phase === 'paused' ? '<span class="tag warn">暂停：有召回在跑，先让给你</span>'
    : pw.phase === 'error' ? '<span class="tag err">出错</span>'
    : pw.phase === 'stopped' ? '<span class="tag">已停</span>'
    : pct >= 100 ? '<span class="tag ok">已完成</span>' : '<span class="tag warn">没做完</span>';
  return `<section class="card" style="margin-bottom:12px">
    <div class="src-head">
      <span class="src-ico" style="background:var(--accent-soft);color:var(--accent)">⚡</span>
      <div style="min-width:0;flex:1"><div class="row" style="gap:8px"><span class="src-name">缓存预热</span>${status}</div>
        <div class="faint" style="margin-top:2px;font-size:12.5px">把历史对话预先算进服务器缓存，召回才能命中缓存、速度正常。预计时间在导入前给过；同步完就在这里做，不留到提问时。</div></div>
      ${run ? '<button class="btn" data-action="prewarm-stop">停止</button>'
        : (state.config && state.config.hostedOnly && !(state.config.hosted && state.config.hosted.granted)) ? ''
        : pct < 100 && !noData ? `<button class="btn primary" data-action="prewarm-start">${pw.phase === 'stopped' || pw.phase === 'error' ? '继续预热' : '开始预热'}</button>` : ''}
    </div>
    <div class="src-body">
      <div style="display:grid;gap:6px">
        <div class="row"><span>${noData && !run ? '还没有可预热的历史（先在「概览」导入）' : run && pw.total ? `第 ${n(pw.done)} / ${n(pw.total)} 条` : `已预热 ${n(pw.coverage.warmed)} / ${n(pw.coverage.segs)} 段`}</span>
          <span class="spacer"></span><span class="faint">${noData && !run ? '' : run ? `覆盖 ${pct}%${pw.etaMs != null ? ` · 还要${etaText(pw.etaMs)}` : ''}` : `${pct}%`}</span></div>
        <div class="bar"><i style="width:${Math.round(frac * 100)}%"></i></div>
        ${pw.phase === 'error' ? `<div style="color:var(--danger);font-size:12.5px">${esc(pw.error || '')}</div>` : ''}
        ${pw.failed ? `<div class="faint" style="font-size:12.5px">${n(pw.failed)} 条失败（下次预热会再试）</div>` : ''}
      </div>
    </div>
  </section>`;
}

function pageSources() {
  return `
  <div class="head"><div><h1>来源</h1><p class="sub">意图系统从哪些应用读历史对话。排除的项目或会话不参与召回，但数据仍保留，随时可以恢复。</p></div>
    <button class="btn" data-action="sync-all">全部立即同步</button></div>
  ${prewarmCard()}
  <div class="sources">${state.sources.map(s => {
    const has = s.imported > 0 && !s.importing;
    const armedClear = state.armed === `clear:${s.id}`;
    return `<section class="card">
      <div class="src-head">
        <span class="src-ico" style="background:${s.color}1a;color:${s.color}">${s.ico}</span>
        <div style="min-width:0"><div class="row" style="gap:8px"><span class="src-name">${esc(s.name)}</span>${srcStatus(s)}</div>
          <div class="faint mono" style="margin-top:2px">${esc(s.root)}</div></div>
        <span class="spacer"></span>
        ${has ? `<span class="muted num" style="font-size:13px">${n(active(s))} 条 · ${s.push ? '推送' : '同步'} ${rel(s.lastSync)}</span>
          <label class="row" style="gap:8px;font-size:13px">参与召回<button class="switch" role="switch" aria-checked="${s.enabled}" data-action="toggle-src" data-id="${s.id}"></button></label>` : ''}
      </div>
      <div class="src-body">
        ${s.error ? `<div class="notice warn" style="margin-bottom:12px"><span>${esc(s.error)}</span><span class="spacer"></span><button class="btn sm" data-action="retry" data-id="${s.id}">重试</button></div>` : ''}
        ${s.importing ? `<div style="display:grid;gap:6px;margin-bottom:12px"><div class="row"><span>${esc(progText(s))}</span><span class="spacer"></span><span class="faint">${Math.round(progFrac(s) * 100)}%</span></div><div class="bar"><i style="width:${progFrac(s) * 100}%"></i></div></div>` : ''}
        <div class="row" style="margin-bottom:12px">
          ${!has && !s.importing ? (s.consent === 'unasked' && !s.total
              ? '<span class="faint">未发现对话（用了这个应用后会出现在这里）</span>'
              : (state.config && state.config.hostedOnly && !(state.config.hosted && state.config.hosted.granted))
                ? '<span class="faint">先在第 ① 步激活（概览）</span>'
                : guideActive()
                  ? '<span class="faint">用上方（概览）的「导入并开始预热」</span>'
                  : `<button class="btn primary" data-action="import" data-id="${s.id}">${s.consent === 'unasked' ? `导入 ${s.sessions} 个会话` : '现在导入'}</button>${s.consent === 'unasked' ? `<button class="btn ghost" data-action="decline" data-id="${s.id}">不要</button>` : ''}`) : ''}
          ${s.importing ? `<button class="btn" data-action="cancel-import" data-id="${s.id}">取消导入</button>` : ''}
          ${has && !s.push ? `<button class="btn" data-action="sync" data-id="${s.id}" ${s.syncing ? 'disabled' : ''}>${s.syncing ? '同步中…' : '立即同步'}</button><button class="btn" data-action="import" data-id="${s.id}">重新导入</button>` : ''}
          ${has ? `<button class="btn danger ${armedClear ? 'armed' : ''}" data-action="clear" data-id="${s.id}">${armedClear ? `确认清空 ${n(s.imported)} 条？` : '清空'}</button>${armedClear ? '<button class="btn ghost" data-action="disarm">算了</button>' : ''}` : ''}
          <span class="spacer"></span>
          ${!s.push && has ? `<span class="faint" style="font-size:12.5px">召回前自动增量同步 · 后台每 ${state.settings.syncEvery} 分钟</span>` : ''}
        </div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>项目 / 目录</th><th class="num">会话</th><th class="num">条数</th><th>最近活动</th><th></th></tr></thead>

function statusTag(r) {
  return { done: '<span class="tag ok">完成</span>', skipped: '<span class="tag">门卫跳过</span>', cancelled: '<span class="tag">已取消</span>', error: '<span class="tag err">失败</span>' }[r.status];
}
function recallLine(r) {
  if (r.status === 'done') return `读了 ${n(r.read)} 条，选中 ${r.selected} 条，问了你 ${r.asked} 条`;
  if (r.status === 'skipped') return `门卫：${r.why}`;
  if (r.status === 'error') return `停在 ${r.stage.toUpperCase()} · ${r.err}`;
  return '本轮未回答';
}
function recallRow(r) {
  return `<tr class="click" data-action="open-recall" data-id="${r.id}">
    <td class="muted num" style="white-space:nowrap">${clockOf(r.at)}</td>
    <td><span class="tag">${r.app}</span></td>
    <td><div class="ellipsis" style="font-weight:550">${esc(r.q)}</div><div class="faint ellipsis" style="font-size:12.5px">${esc(recallLine(r))}</div></td>

    <td class="num muted" style="white-space:nowrap;text-align:right">${dur(r.ms)}</td></tr>`;
}

async function refreshLive(announce) {

const fmtMs = ms => (ms === undefined ? undefined : dur(ms));
function mapRecalls(rows) {

        stages: [['门卫', r.stages.gate], ['理解问题', r.stages.s1], ['逐条面试', r.stages.s3], ['守门员摘句', r.stages.s4]]
          .filter(([, ms]) => ms !== undefined).map(([l, ms]) => [l, fmtMs(ms)]),

const LIVE_ACTIONS = new Set(['next-import-all', 'engine-mode', 'user-key-save', 'user-key-delete', 'prewarm-start', 'prewarm-stop', 'hosted-activate', 'hosted-revoke', 'import', 'sync', 'sync-all', 'decline', 'toggle-src', 'clear', 'exclude', 'exclude-session', 'expand', 'retry', 'cancel-import', 'save', 'test-endpoint', 'wipe', 'app-switch', 'endpoint-mode']);

const IMPORT_MS = 8000, SYNC_MS = 1200;
function tick() {
  if (LIVE.on) return;
  let changed = false;
  for (const s of state.sources) {
    if (s.importing) {
      const f = Math.min(1, (Date.now() - s.importing) / IMPORT_MS);
      s.imported = Math.round(s.total * f); changed = true;
      if (f >= 1) { s.importing = null; s.lastSync = Date.now(); s.enabled = true; toast(`${s.name} 导入完成：${n(s.total)} 条`); }
    }
    if (s.syncing && Date.now() - s.syncing >= SYNC_MS) {

      s.syncing = null; s.imported += add; s.total += add; s.lastSync = Date.now(); changed = true;
      toast(`${s.name} 同步完成：新增 ${add} 条`);
    }
  }
  if (changed) render();
}

    case 'cancel-import': Object.assign(s, { importing: null, imported: 0 }); toast('已取消导入'); break;
